plugins { id 'com.android.application' }

// Per-pet values come from the workflow: -PpetId=<id> -PpetName="<Display Name>"
def petId = (project.findProperty('petId') ?: 'pet').toString().toLowerCase().replaceAll('[^a-z0-9_]', '_')
def petName = (project.findProperty('petName') ?: 'Pet').toString()

android {
    namespace 'com.petforge.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.petforge.pet." + petId
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'app_name', petName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // Signed with the standard Android debug key generated by the SDK on the build machine.
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
