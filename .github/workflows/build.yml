name: build-pet

# Manual trigger: pick a pet folder under pets/<name>/ (animations.xml + sprite.png)
on:
  workflow_dispatch:
    inputs:
      pet:
        description: "Pet folder name under pets/"
        required: true
        default: "mareep"

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Cross-compile Windows exe
        run: |
          cd windows
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w" -o ../out/${{ inputs.pet }}.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pet }}-exe
          path: out/${{ inputs.pet }}.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK (official Android SDK preinstalled on runner)
        run: echo "Gradle project goes here once the Android app exists"
      # Signing uses repository secrets only; never commit a keystore:
      #   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS
